<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATUBOOM — Editorial Magazine & Journal</title>
    <!-- Google Fonts: Inter with multiple weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #FFFFFF;
            --bg-surface: #FFFFFF;
            --bg-card: #FFFFFF;
            --accent-red: #a0092c;
            --accent-red-hover: #b80c34;
            --accent-red-light: rgba(160, 9, 44, 0.15);
            --text-primary: #000000;
            --text-secondary: #000000;
            --text-muted: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
            --border-red: rgba(160, 9, 44, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- TYPOGRAPHY UTILITIES --- */
        .w-100 { font-family: 'Inter', sans-serif; font-weight: 100; }
        .w-200 { font-family: 'Inter', sans-serif; font-weight: 200; }
        .w-300 { font-family: 'Inter', sans-serif; font-weight: 300; }
        .w-400 { font-family: 'Inter', sans-serif; font-weight: 400; }
        .w-500 { font-family: 'Inter', sans-serif; font-weight: 500; }
        .w-600 { font-family: 'Inter', sans-serif; font-weight: 600; }
        .w-700 { font-family: 'Inter', sans-serif; font-weight: 700; }
        .w-800 { font-family: 'Inter', sans-serif; font-weight: 800; }
        .w-900 { font-family: 'Inter', sans-serif; font-weight: 900; }

        .editorial-label {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent-red);
            display: inline-block;
            margin-bottom: 0.75rem;
        }

        /* --- CONTAINER --- */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* --- HEADER / NAVBAR --- */
        .editorial-header {
            width: 100%;
            background-color: #FFF;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-logo-row {
            width: 100%;
            padding: 25px 0;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: inline-block;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: -0.05em;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-red);
        }

        .logo-img {
            width: 120px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .header-nav-row {
            width: 100%;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .header-nav-row ul {
            display: flex;
            justify-content: center;
            align-items: center;
            list-style: none;
            gap: 2.5rem;
            margin: 0;
            padding: 0;
        }

        .header-nav-row a {
            font-family: 'Inter', sans-serif;
            color: #000000;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .header-nav-row a:hover {
            color: var(--accent-red);
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 3rem 0 4rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .hero-layout {
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 2.5rem;
            align-items: start;
        }

        .hero-main-content {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 2rem;
            align-items: start;
            padding-right: 2.5rem;
            border-right: 1px solid rgba(0, 0, 0, 0.1);
        }

        .hero-main-image {
            width: 100%;
            overflow: hidden;
        }

        .hero-main-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hero-content-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-self: stretch;
        }

        /* Barra lateral derecha (Artículos secundarios) */
        .hero-sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 2rem;
        }

        .sidebar-card {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding-bottom: 1.5rem;
        }

        .sidebar-card:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .sidebar-card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            margin-bottom: 0.75rem;
        }

        .sidebar-category {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #333333;
            margin-bottom: 0.4rem;
        }

        .sidebar-title {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1.35;
            color: #000000;
            margin-bottom: 0.5rem;
            text-decoration: none;
        }

        .sidebar-title:hover {
            color: var(--accent-red);
        }

        .sidebar-author {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.8rem;
            color: #666666;
        }

        .sidebar-author strong {
            font-weight: 600;
            color: #121212;
            text-decoration: underline;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--accent-red);
            color: #fff;
            padding: 1rem 2rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(160, 9, 44, 0.3);
            text-align: center;
            width: fit-content;
        }

        .btn-primary:hover {
            background-color: var(--accent-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(160, 9, 44, 0.5);
        }

        /* --- STATS BAR --- */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background-color: #FFFFFF;
        }

        .stat-item {
            padding: 2.5rem 2rem;
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-number {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 2.8rem;
            color: #000000;
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        .stat-number span {
            color: var(--accent-red);
        }

        .stat-label {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.85rem;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* --- EDITORIAL ARTICLES GRID --- */
        .editorial-section {
            padding: 6rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 1rem;
        }

        .section-title {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
        }

        .article-card {
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border-red);
            padding-top: 1.5rem;
            transition: transform 0.3s;
        }

        .article-card:hover {
            transform: translateY(-4px);
        }

        .article-num {
            font-family: 'Inter', sans-serif;
            font-weight: 100;
            font-size: 3rem;
            color: var(--accent-red);
            line-height: 1;
            margin-bottom: 1rem;
        }

        .article-title {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1.3;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        .article-excerpt {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .article-meta {
            margin-top: auto;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        /* --- FEATURED QUOTE / MANIFESTO --- */
        .manifesto {
            padding: 8rem 0;
            background-color: var(--bg-surface);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .quote-text {
            font-family: 'Inter', sans-serif;
            font-weight: 200;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            line-height: 1.25;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }

        .quote-text strong {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            color: #000;
            background: linear-gradient(120deg, transparent 0%, rgba(160, 9, 44, 0.4) 0%);
        }

        .author {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-red);
        }

        /* --- NEWSLETTER / CTA --- */
        .cta-section {
            padding: 7rem 0;
            text-align: center;
        }

        .cta-box {
            max-width: 700px;
            margin: 0 auto;
            background: #FFFFFF;
            border: 1px solid var(--border-red);
            padding: 4rem 3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .cta-title {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }

        .cta-desc {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 1.05rem;
            color: var(--text-secondary);
