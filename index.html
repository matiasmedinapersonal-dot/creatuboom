<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="LOGOROJO.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREATUBOOM — Próximamente</title>
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Evita que se pueda deslizar o hacer scroll */
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      color: #0d0d0d;
    }

    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Logo centrado */
    .logo-container {
      margin-bottom: 24px;
    }

    .logo-img {
      height: 60px; /* Ajusta la altura de tu logo según prefieras */
      width: auto;
      display: block;
    }

    /* Línea divisoria gris como la de tu diseño */
    .divider-line {
      width: 100%;
      max-width: 800px;
      height: 1px;
      background-color: #e5e5e5;
      margin-bottom: 32px;
    }

    /* Mensaje principal con estilo de menú (Inter, Mayúsculas, espaciado) */
    .message {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #0d0d0d;
      margin-bottom: 36px;
      text-align: center;
    }

    /* Estilo del Contador */
    .countdown-grid {
      display: flex;
      gap: 24px;
      text-align: center;
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }

    .number {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0d0d0d;
      line-height: 1;
      margin-bottom: 6px;
    }

    .label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #777777;
    }

    /* Adaptación para pantallas pequeñas / celulares */
    @media (max-width: 480px) {
      .logo-img {
        height: 48px;
      }
      .message {
        font-size: 0.85rem;
        letter-spacing: 1.5px;
      }
      .countdown-grid {
        gap: 14px;
      }
      .number {
        font-size: 1.75rem;
      }
      .label {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo -->
    <div class="logo-container">
      <img src="LOGOROJO.png" alt="Logo Crea Tu Boom" class="logo-img">
    </div>

    <!-- Línea divisoria gris -->
    <div class="divider-line"></div>

    <!-- Texto con estilo Inter -->
    <div class="message">
      Nuestra página web está llegando
    </div>

    <!-- Contador marcha atrás -->
    <div class="countdown-grid">
      <div class="countdown-item">
        <span class="number" id="days">00</span>
        <span class="label">Días</span>
      </div>
      <div class="countdown-item">
        <span class="number" id="hours">00</span>
        <span class="label">Horas</span>
      </div>
      <div class="countdown-item">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutos</span>
      </div>
      <div class="countdown-item">
        <span class="number" id="seconds">00</span>
        <span class="label">Segundos</span>
      </div>
    </div>
  </div>

  <script>
    // Fecha de lanzamiento: Lunes 19 de Octubre de 2026 (00:00 hs)
    const targetDate = new Date('October 19, 2026 00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById('days').innerText = '00';
        document.getElementById('hours').innerText = '00';
        document.getElementById('minutes').innerText = '00';
        document.getElementById('seconds').innerText = '00';
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    // Actualiza el contador cada segundo
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
